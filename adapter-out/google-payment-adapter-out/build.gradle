dependencies {
    // application layer
    implementation project(':application:member-application')
    // google play
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.apis:google-api-services-androidpublisher:v3-rev20231012-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.20.0'
}

tasks.register('copyPrivate', Copy) {
    copy {
        from('../../configs/adapter-out/google-payment-adapter-out/') {
            include('application.yml')
            rename('application.yml', 'payment-google.yml')
        }
        into('src/main/resources')
    }
    copy {
        from('../../configs/adapter-out/google-payment-adapter-out/')
        include('application.yml')
        into('src/test/resources')
    }
    copy {
        from '../../configs/adapter-out/google-payment-adapter-out/'
        include 'account-google.json'
        into 'src/main/resources'
    }
    copy {
        from '../../configs/adapter-out/google-payment-adapter-out/'
        include 'account-google.json'
        into 'src/test/resources'
    }
}