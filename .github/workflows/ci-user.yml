name: CI USER
on:
  push:
    branches:
      - develop
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  # domain 모듈 단위 테스트
  domain-unit-test:
    name: Domain 모듈 단위 테스트
    runs-on: ubuntu-latest
    steps:
      # 소스 로드
      - name: 소스 코드 로드
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Gradle 권한 부여
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate
      # Device Domain 모듈 단위 테스트
      - name: Device Domain 모듈 단위 테스트
        run: ./gradlew :user-service:domain:device-domain:test
      # Member Domain 모듈 단위 테스트
      - name: Member Domain 모듈 단위 테스트
        run: ./gradlew :user-service:domain:member-domain:test
      # 레포트 생성
      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
  # application 모듈 단위 테스트
  application-unit-test:
    name: Application 모듈 단위 테스트
    runs-on: ubuntu-latest
    steps:
      # 소스 로드
      - name: 소스 코드 로드
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Gradle 권한 부여
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate
      # Device Application/Domain 모듈 단위 테스트
      - name: Device Application/Domain 모듈 단위 테스트
        run: ./gradlew :user-service:application:device-application:test
      # Member Application/Domain 모듈 단위 테스트
      - name: Member Application/Domain 모듈 단위 테스트
        run: ./gradlew :user-service:application:member-application:test
      # 레포트 생성
      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
  # adapter out 모듈 단위 테스트
  adapter-out-unit-test:
    name: Adapter out 모듈 단위 테스트
    runs-on: ubuntu-latest
    steps:
      # 소스 로드
      - name: 소스 코드 로드
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Gradle 권한 부여
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate
      # Device Cache Adapter Out 모듈 단위 테스트
      - name: Device Cache Adapter Out 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-out:device-cache-adapter-out:test
      # Device Event Adapter Out  모듈 단위 테스트
      - name: Device Event Adapter Out 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-out:device-event-adapter-out:test
      # Device Publish Adapter Out 모듈 단위 테스트
      - name: Device Publish Adapter Out 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-out:device-publish-adapter-out:test
      # Google Payment Adapter Out 모듈 단위 테스트
      - name: Google Payment Adapter Out 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-out:google-payment-adapter-out:test
      # Member Event Adapter Out 모듈 단위 테스트
      - name: Member Event Adapter Out 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-out:member-event-adapter-out:test
      # Member Persistence Adapter Out 모듈 단위 테스트
      - name: Member Persistence Adapter Out 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-out:member-persistence-adapter-out:test
      # Member Publish Adapter Out 모듈 단위 테스트
      - name: Member Publish Adapter Out 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-out:member-publish-adapter-out:test
      # 레포트 생성
      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
  # adapter in 모듈 단위 테스트
  adapter-in-unit-test:
    name: Adapter in 모듈 단위 테스트
    runs-on: ubuntu-latest
    steps:
      # 소스 로드
      - name: 소스 코드 로드
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Gradle 권한 부여
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate
      # Device Event Adapter In 모듈 단위 테스트
      - name: Device Event Adapter In 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-in:device-event-adapter-in:test
      # Device Web Adapter In 모듈 단위 테스트
      - name: Device Web Adapter In 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-in:device-web-adapter-in:test
      # Member Event Adapter In 모듈 단위 테스트
      - name: Member Event Adapter In 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-in:member-event-adapter-in:test
      # Member Web Adapter In 모듈 단위 테스트
      - name: Member Web Adapter In 모듈 단위 테스트
        run: ./gradlew :user-service:adapter-in:member-web-adapter-in:test
      # 레포트 생성
      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
  # User API 빌드 테스트
  bootstrap-build-test:
    name: User API 빌드 테스트
    needs:
      - domain-unit-test
      - application-unit-test
      - adapter-out-unit-test
      - adapter-in-unit-test
    runs-on: ubuntu-latest
    steps:
      # 소스 로드
      - name: 소스 코드 로드
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Gradle 권한 부여
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate
      # Bootstrap User API 빌드
      - name: User Bootstrap API 모듈 빌드
        run: ./gradlew :user-service:bootstrap:user-bootstrap-api:build -x test