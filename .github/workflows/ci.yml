name: DEVELOP CI
on:
  pull_request:
    branches: [ develop, refac/user-api ]
jobs:
  # 각 모듈 별 단위 테스트
  unit-test:
    runs-on: ubuntu-latest
    steps:
      # 소스 로드
      - name: Checkout the code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: Set up jdk
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: configuration set up
        run: ./gradlew copyPrivate
      # Device Application/Domain 모듈 단위 테스트
      - name: Application device unit test
        run: ./gradlew :application:device-application:test
      # Member Application/Domain 모듈 단위 테스트
      - name: Application member unit test
        run: ./gradlew :application:member-application:test
      # Device Event Adapter Out  모듈 단위 테스트
      - name: Adapter out event device unit test
        run: ./gradlew :adapter-out:device-event-adapter-out:test
      # Device Persistence Adapter Out 모듈 단위 테스트
      - name: Adapter out persistence device unit test
        run: ./gradlew :adapter-out:device-persistence-adapter-out:test
      # Device Publish Adapter Out 모듈 단위 테스트
      - name: Adapter out publish device unit test
        run: ./gradlew :adapter-out:device-publish-adapter-out:test
      # Google Payment Adapter Out 모듈 단위 테스트
      - name: Adapter out google payment unit test
        run: ./gradlew :adapter-out:google-payment-adapter-out:test
      # Member Event Adapter Out 모듈 단위 테스트
      - name: Adapter out event member unit test
        run: ./gradlew :adapter-out:member-event-adapter-out:test
      # Member Persistence Adapter Out 모듈 단위 테스트
      - name: Adapter out persistence member unit test
        run: ./gradlew :adapter-out:member-persistence-adapter-out:test
      # member Publish Adapter Out 모듈 단위 테스트
      - name: Adapter out publish member unit test
        run: ./gradlew :adapter-out:member-publish-adapter-out:test
      # Device Event Adapter In 모듈 단위 테스트
      - name: Adapter in event device unit test
        run: ./gradlew :adapter-in:device-event-adapter-in:test
      # Device Web Adapter In 모듈 단위 테스트
      - name: Adapter in web device unit test
        run: ./gradlew :adapter-in:device-web-adapter-in:test
      # Member Event Adapter In 모듈 단위 테스트
      - name: Adapter in event member unit test
        run: ./gradlew :adapter-in:member-event-adapter-in:test
      # Member Web Adapter In 모듈 단위 테스트
      - name: Adapter in web member unit test
        run: ./gradlew :adapter-in:member-web-adapter-in:test
  # 빌드 테스트
  build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      # 소스 로드
      - name: Checkout the code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: Set up jdk
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: configuration set up
        run: ./gradlew copyPrivate
      # Bootstrap User API 빌드
      - name: Bootstrap user API build
        run: ./gradlew :bootstrap:user-bootstrap-api:build -x test
