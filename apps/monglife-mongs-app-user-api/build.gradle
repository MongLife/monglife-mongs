dependencies {

    implementation "com.google.api-client:google-api-client:1.33.0"
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.6.0'
    implementation 'com.google.apis:google-api-services-androidpublisher:v3-rev20220411-1.32.1'
    implementation group: 'com.google.http-client', name: 'google-http-client-jackson2', version: '1.41.7'

    // domains
    implementation project(':domains:monglife-mongs-domain-member')

    // modules
    implementation project(':modules:monglife-mongs-module-security')
    implementation project(':modules:monglife-mongs-module-mqtt')
}

tasks.register('copyPrivate', Copy) {
    copy {
        from '../../configs/apps/monglife-mongs-app-user-api/'
        include 'application*.yml'
        into 'src/main/resources'
    }
}