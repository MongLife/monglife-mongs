plugins {
    id "java-library"
    id "org.springframework.boot"        version "${springBootVersion}"
    id "io.spring.dependency-management" version "${springDependencyManagementVersion}"
}

bootJar {
    enabled(false)
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "org.springframework.boot"
    apply plugin: "io.spring.dependency-management"

    jar {
        enabled(false)
    }

    bootJar {
        duplicatesStrategy = DuplicatesStrategy.FAIL
        archiveFileName = "${project.name}.jar"
        enabled(true)
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2022.0.3"
        }
    }

    dependencies {
        // monglife-core
        implementation "com.github.monglife:monglife-core:${monglifeCoreVersion}"
        // monglife-logging
        implementation "com.github.monglife.monglife-module-common:monglife-module-common-logging:${monglifeModuleCommonVersion}"
        // lombok
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        // spring
        implementation "org.springframework.boot:spring-boot-starter-web"
        developmentOnly "org.springframework.boot:spring-boot-devtools"
        // prometheus
        implementation "org.springframework.boot:spring-boot-starter-actuator:${acuatorVersion}"
        runtimeOnly "io.micrometer:micrometer-registry-prometheus"
    }
}