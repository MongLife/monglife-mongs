plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

bootJar {
    enabled(false)
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    jar {
        enabled(false)
    }

    bootJar {
        duplicatesStrategy = DuplicatesStrategy.FAIL
        enabled(true)
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2022.0.3"
        }
    }

    dependencies {
        // monglife-core
        implementation 'com.github.monglife:monglife-core:2.0.10'
        // monglife-logging
        implementation 'com.github.monglife.monglife-module-common:monglife-module-common-logging:1.0.11'
        // spring
        implementation 'org.springframework.boot:spring-boot-starter-web'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        // lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        // prometheus
        implementation 'org.springframework.boot:spring-boot-starter-actuator:3.2.1'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    }
}