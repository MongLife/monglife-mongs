dependencies {
    // application layer
    implementation project(":character-service:application:mong-application")
    // core layer
    implementation project(":common:core:kafka-event-core")
    // monglife-logging
    implementation "com.github.monglife.monglife-module-common:monglife-module-common-logging:${monglifeModuleCommonVersion}"
    // monglife-jpa
    implementation "com.github.monglife.monglife-module-common:monglife-module-common-jpa:${monglifeModuleCommonVersion}"
    // monglife-kafka
    implementation "com.github.monglife.monglife-module-common:monglife-module-common-kafka:${monglifeModuleCommonVersion}"
    // mysql
    runtimeOnly "com.mysql:mysql-connector-j"
    // queryDSL
    implementation "com.querydsl:querydsl-jpa:5.0.0:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties["querydsl.version"]}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    // test
    // local 프로파일이 H2 인메모리를 쓰므로 앱 런타임에도 필요하다(테스트 전용 아님).
    runtimeOnly "com.h2database:h2"
    // test
    testImplementation "org.springframework.kafka:spring-kafka-test"
}